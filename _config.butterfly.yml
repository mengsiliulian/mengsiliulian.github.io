# Butterfly 主题覆盖配置
# 说明：此文件优先级高于 themes/butterfly/_config.yml

# 站点图标（可换成你自己的 favicon）
favicon:
  small: /img/favicon.png

# 博客名
blog_title:
  enable: true

# 导航菜单
nav:
  logo:
    brightness: false
  display_title: true
  fixed: false
  announcements:
  menu:
    首页: /
    归档: /archives/ || fas fa-folder-open
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder

# 封面页（首页是否启用大图）
cover:
  index_enable: true

# 搜索
search:
  # Choose: algolia_search / local_search / docsearch
  use: local_search
  placeholder: 搜索文章...
  local_search:
    CDN:
    preload: true

# 页脚
footer:
  owner:
    enable: true

# 字数统计（可选，若装插件后可开）
wordcount:
  enable: false

# 近期文章
aside:
  card_recent_post:
    enable: true
    limit: 5

# 代码高亮
highlight_theme: mac

# 文章置顶 / 版权
post_meta:
  page:
    date_type: both

# 阅读进度
reading_progress:
  enable: true
