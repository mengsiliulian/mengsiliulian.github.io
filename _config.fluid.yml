#-----------------------------------------------------------
# Hexo Theme Fluid 精简配置（AI 新闻周报）
# 化繁为简：干净排版 + 首页大图 + 置顶推荐 + 手机适配
#-----------------------------------------------------------

# 浏览器标签图标
favicon: /img/favicon.png
apple_touch_icon: /img/favicon.png

# 标签页标题分隔符：文章名 - 站点名
tab_title_separator: " - "

# 强推 HTTPS
force_https: true

# 自定义 CSS（Banner 渐变背景等）
custom_css: /css/custom.css

# 自定义 JS（文章点赞 + 返回上一步，纯前端）
custom_js:
  - /js/like.js
  - /js/back.js

# 静态资源前缀覆盖：busuanzi 脚本改自托管（原 CDN 国内不稳定 + 防投毒）
static_prefix:
  busuanzi: /js
  # 全部第三方库改自托管（消除 baomitu CDN 依赖，加速加载）
  jquery: /lib
  bootstrap: /lib
  typed: /lib
  nprogress: /lib

#-----------------------------------------------------------
# 顶栏
#-----------------------------------------------------------
navbar:
  # 左侧标题，为空则用 hexo config 的 title
  blog_title: "AI 新闻周报"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "meme", name: "网络百科", link: "/meme/", icon: "iconfont icon-book" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

#-----------------------------------------------------------
# 搜索
#-----------------------------------------------------------
search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

#-----------------------------------------------------------
# 首屏大图
#-----------------------------------------------------------
banner:
  random_img: false
  parallax: true
  width_height_ratio: 1.0

scroll_down_arrow:
  enable: true

scroll_top_arrow:
  enable: true

#-----------------------------------------------------------
# 页脚
#-----------------------------------------------------------
footer:
  content: '
    <a href="https://hexo.io" target="_blank" rel="nofollow noopener"><span>Hexo</span></a>
    <i class="iconfont icon-love"></i>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener"><span>Fluid</span></a>
  '
  statistics:
    enable: true
    source: "busuanzi"
  beian:
    enable: false

#-----------------------------------------------------------
# 首页
#-----------------------------------------------------------
index:
  # 首页 Banner：去掉图片，改用 CSS 渐变背景（见 /css/custom.css）
  banner_img:
  banner_img_height: 60
  banner_mask_alpha: 0

  # 副标语
  slogan:
    enable: true
    text: "AI 动态 · 二次元趣闻 · 教程干货"

  # 自动截取摘要
  auto_excerpt:
    enable: true

  # 打开文章方式：本页打开
  post_url_target: _self

  # 文章信息显示
  post_meta:
    date: true
    category: true
    tag: true

  # 置顶文章图标（用于“推荐”）
  post_sticky:
    enable: true
    icon: "iconfont icon-top"

#-----------------------------------------------------------
# 文章页
#-----------------------------------------------------------
post:
  # 文章页顶部：同样去掉图片，用渐变背景
  banner_img:
  banner_img_height: 30
  banner_mask_alpha: 0

  # 默认文章封面（首页文章列表缩略图）
  default_index_img:

  # 标题下方元信息
  meta:
    author:
      enable: false
    date:
      enable: true
      format: "LL a"
    wordcount:
      enable: true
    min2read:
      enable: false
      awl: 2
      wpm: 60
    views:
      enable: true
      source: "busuanzi"

  updated:
    enable: false

  # 文章目录 TOC
  toc:
    enable: true
    number: true
    expand: false
    scrollspy: true

  # 上一篇 / 下一篇
  prev_next:
    enable: true

  # 文章底部标签
  tag_meta: true

  # 相关文章
  related_posts:
    enable: true
    limit: 4
    date_type: created
    cover: true

  # 版权信息
  copyright:
    enable: true
    creation: false
    license: "CC BY-NC-SA 4.0"
    link: "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  # 评论（giscus）—— 注意：必须放在 post 段内才能生效
  comments:
    enable: true
    type: giscus

#-----------------------------------------------------------
# 侧边栏
#-----------------------------------------------------------
sidebar:
  # 是否显示头像
  avatar: true
  # 是否显示社交媒体
  social: true

#-----------------------------------------------------------
# 评论插件配置（giscus 参数，顶层读取）
#-----------------------------------------------------------
giscus:
  repo: "mengsiliulian/mengsiliulian.github.io"
  repo-id: "R_kgDOTu8OEg"
  category: "Announcements"
  category-id: "DIC_kwDOTu8OEs4DCw0u"
  theme-light: light
  theme-dark: dark
  mapping: pathname
  reactions-enabled: 1
  emit-metadata: 0
  input-position: top
  lang: zh-CN
