name: 自动部署博客

# 触发条件：push 到 source 分支时自动运行
on:
  push:
    branches:
      - source

# 需要写 main 分支 + 部署 Pages 的权限
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只允许一个部署在跑，避免排队冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1. 拉取最新源码（source 分支）
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: source

      # 2. 安装 Node.js
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装依赖（Hexo 等）
      - name: 安装依赖
        run: npm ci

      # 4. 生成静态网站（public/ 目录）
      - name: 构建网站
        run: npx hexo generate

      # 5. 上传构建产物作为 Pages artifact（Actions 部署方式）
      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 6. 部署到 GitHub Pages（不再走 legacy 排队系统）
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 7. 同时把构建产物推送到 main 分支（保留双分支备份习惯）
      - name: 推送到 main 分支
        run: |
          cd public
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy: $(date +'%Y-%m-%d %H:%M:%S')"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mengsiliulian/mengsiliulian.github.io.git main
